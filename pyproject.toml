[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldrsi"
version = "0.1.0"
description = "File-backed WorldRSI protocols, tools and direct Codex agent workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wrsi = "worldrsi.cli:main"

[tool.setuptools.packages.find]
include = ["worldrsi*", "tools_runtime*"]

[tool.setuptools.package-data]
tools_runtime = ["assets/godot/*"]
